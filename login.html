<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #fffaf5;
    }
    header {
      text-align: center;
      position: relative;
      height: 150px;
    }
    #logobg1 {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 50px;
      background-color: #FFF3E7;
      border-radius: 50px;
      line-height: 50px;
      font-size: 32px;
      font-weight: 700;
    }
    #logobg2 {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      height: 50px;
      background-color: #FFF3E7;
      border-radius: 50px;
      line-height: 50px;
      font-size: 32px;
      font-weight: 700;
    }
    #main {
      max-width: 600px;
      margin: 10px auto 40px;
      padding: 40px 20px;
      background-color: #FFF3E7;
      border-radius: 12px;
      position: relative;
    }
    #title {
      text-align: center;
      font-weight: 700;
      font-size: 36px;
      margin-bottom: 30px;
    }
    .userInput {
      width: 100%;
      height: 50px;
      margin: 10px 0;
      padding-left: 20px;
      font-size: 18px;
    }
    #btn {
      width: 100%;
      height: 60px;
      border-radius: 17px;
      border: none;
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
      background-color: #ffd7a8;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      #logobg1 {
        width: 120px;
        font-size: 24px;
        top: 40px;
      }
      #logobg2 {
        width: 200px;
        font-size: 24px;
        top: 75px;
      }
      #main {
        margin-top: 160px;
        padding: 30px 15px;
      }
      #title {
        font-size: 28px;
      }
      .userInput {
        font-size: 16px;
        height: 45px;
      }
      #btn {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div id="logobg1">펫진진</div>
    <div id="logobg2">PetJinJin</div>
  </header>

  <form name="loginform">
    <div id="main">
      <legend id="title">로그인</legend>

      <input class="userInput" name="loginId" type="text" placeholder="아이디" required />
      <input class="userInput" name="loginPw" type="password" placeholder="비밀번호" required />

      <button type="submit" id="btn">로그인</button>
    </div>
  </form>

  <script>
    const $form = document.forms.loginform;
    const $logo1 = document.getElementById('logobg1');
    const $logo2 = document.getElementById('logobg2');

    // 로고 클릭 시 메인 페이지 이동
    $logo1.onclick = () => location.href = "PetJinJin.html";
    $logo2.onclick = () => location.href = "PetJinJin.html";

    // 폼 제출 시 로그인 확인 + 쿠키 저장
    $form.onsubmit = function () {
  const inputId = this.loginId.value;
  const inputPw = this.loginPw.value;

  const savedId = localStorage.getItem("userId");
  const savedPw = localStorage.getItem("userPw");

  if (inputId === savedId && inputPw === savedPw) {
    // ✅ 로그인 성공: 쿠키에 아이디 저장 (30초 유지)
    const expiry = new Date();
    expiry.setTime(expiry.getTime() + 30 * 1000); // 30초 후 만료
    document.cookie = `userId=${inputId}; expires=${expiry.toUTCString()}; path=/`;

    alert("로그인 성공! 메인 페이지로 이동합니다.");
    location.href = "signin.html";
  } else {
    alert("아이디 또는 비밀번호가 일치하지 않습니다.");
  }

  return false; // 페이지 리로드 방지
};

  </script>
</body>
</html>
